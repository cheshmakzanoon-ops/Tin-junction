name: Native model conformance

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'web/src/documents/**'
      - 'web/src/simulation/vehicleCatalog.ts'
      - 'tests/fixtures/documents/**'
      - 'tools/ios/**'
      - 'tools/build-web.mjs'
      - 'package*.json'
      - '.github/workflows/native-models.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'web/src/documents/**'
      - 'web/src/simulation/vehicleCatalog.ts'
      - 'tests/fixtures/documents/**'
      - 'tools/ios/**'
      - 'tools/build-web.mjs'
      - 'package*.json'
      - '.github/workflows/native-models.yml'
  workflow_dispatch:

permissions:
  contents: read

# This focused lane is additional evidence. The existing full iOS Simulator
# workflow remains unchanged and mandatory for candidate health and release.
concurrency:
  group: native-models-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-models:
    name: Swift document and bridge conformance
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Inventory the exact SDK and simulator
        run: |
          mkdir -p artifacts/ios
          sw_vers | tee artifacts/ios/macos-version.txt
          xcodebuild -version | tee artifacts/ios/xcode-version.txt
          xcodebuild -showsdks | tee artifacts/ios/sdks.txt
          xcrun simctl list --json > artifacts/ios/simulator-inventory.json
          test "$(sed -n '1p' artifacts/ios/xcode-version.txt)" = 'Xcode 27.1'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.1'
      - name: Install locked dependencies and verify shared fixtures
        run: |
          npm ci
          node --test tests/project/document-fixtures.test.mjs
          node --test tools/ios/*.test.mjs
      - name: Build the offline native web bundle
        run: npm run bundle:ios
      - name: Install checksum-pinned XcodeGen
        id: xcodegen
        run: bash tools/ios/install-xcodegen.sh
      - name: Generate the native Xcode project
        env:
          XCODEGEN_BIN: ${{ steps.xcodegen.outputs.binary }}
        run: '"$XCODEGEN_BIN" generate --spec apps/ios/project.yml'
      - name: Select actual Duo simulator without fallback
        id: simulator
        run: node tools/ios/select-duo.mjs artifacts/ios/simulator-inventory.json --github-output | tee artifacts/ios/selected-simulator.json
      - name: Boot Duo if needed
        if: steps.simulator.outputs.state == 'Shutdown'
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl boot "$TIN_SIMULATOR_UDID"
      - name: Compile Swift and run the unit model target
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: bash tools/ios/test-models.sh
      - name: Preserve scoped evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-models-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios/*.txt
            artifacts/ios/*.json
            artifacts/ios/*.log
            artifacts/ios/*.xcresult
            artifacts/ios/screenshots/
          if-no-files-found: error
          retention-days: 14
