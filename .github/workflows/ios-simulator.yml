name: iOS Simulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One-time queue recovery: the former group is held by run 40458903139
  # beyond its configured deadline with no logs/artifacts available.
  # Keep future native runs serialized; see INC-NATIVE-QUEUE-20261027.
  group: ios-simulator-v2-${{ github.ref }}
  # Keep running native evidence intact across frequent reviewed checkpoints.
  cancel-in-progress: false

jobs:
  duo-host:
    name: Duo native host and bundled WebGL2
    runs-on: xcode-27
    defaults:
      run:
        shell: bash
    # Preserve the full-suite ceiling, then allow the separate clean-install
    # trial and evidence upload. Each native invocation remains bounded below.
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Inventory the exact runner and SDK
        run: |
          mkdir -p artifacts/ios
          sw_vers | tee artifacts/ios/macos-version.txt
          xcodebuild -version | tee artifacts/ios/xcode-version.txt
          xcodebuild -showsdks | tee artifacts/ios/sdks.txt
          xcrun simctl list --json > artifacts/ios/simulator-inventory.json
          test "$(sed -n '1p' artifacts/ios/xcode-version.txt)" = 'Xcode 27.1'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '27.1'
      - name: Install locked web dependencies
        run: npm ci
      - name: Test simulator selector
        run: node --test tools/ios/select-duo.test.mjs
      - name: Build the offline native web bundle with explicit diagnostic fixtures
        run: |
          npm run bundle:ios -- --asset-probe
          # CI packaging input only. Installed-app verification is separate below.
          cp apps/ios/TinJunction/Resources/WebAssets/bundle-manifest.json artifacts/ios/packaged-web-input-manifest.json
      - name: Install checksum-pinned XcodeGen
        id: xcodegen
        run: bash tools/ios/install-xcodegen.sh
      - name: Generate the native Xcode project
        env:
          XCODEGEN_BIN: ${{ steps.xcodegen.outputs.binary }}
        run: '"$XCODEGEN_BIN" generate --spec apps/ios/project.yml'
      - name: Select actual Duo simulator without fallback
        id: simulator
        run: node tools/ios/select-duo.mjs artifacts/ios/simulator-inventory.json --github-output | tee artifacts/ios/selected-simulator.json
      - name: Boot Duo if needed
        if: steps.simulator.outputs.state == 'Shutdown'
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl boot "$TIN_SIMULATOR_UDID"
      - name: Compile Swift and execute unit and UI smoke tests
        id: native_tests
        timeout-minutes: 45
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: bash tools/ios/test-simulator.sh
      - name: Verify web resource identity in the actual installed app
        id: installed_web
        if: success() && steps.native_tests.outcome == 'success'
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          tin_compiled_app=artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/TinJunction.app
          tin_bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$tin_compiled_app/Info.plist")"
          test -n "$tin_bundle_identifier"
          tin_installed_app="$(xcrun simctl get_app_container "$TIN_SIMULATOR_UDID" "$tin_bundle_identifier" app)"
          test -n "$tin_installed_app"
          node tools/ios/record-installed-web.mjs "$tin_installed_app/WebAssets" artifacts/ios artifacts/ios/packaged-web-input-manifest.json
      - name: Repeat packaged asset probes after observed clean app reinstall
        id: clean_install_tests
        if: success() && steps.native_tests.outcome == 'success' && steps.installed_web.outcome == 'success'
        # The runner bounds xcodebuild itself to 20 minutes; retain five more
        # for reset verification, attachment export and installed-byte checks.
        timeout-minutes: 25
        env:
          TIN_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: node tools/ios/test-clean-install.mjs
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duo-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ios/*.txt
            artifacts/ios/*.json
            artifacts/ios/*.log
            artifacts/ios/*.xcresult
            artifacts/ios/screenshots/
            artifacts/ios/clean-install-*/
          if-no-files-found: error
          retention-days: 14
