name: Repository and web quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  # Keep running verification intact; the newest pending revision runs next.
  cancel-in-progress: false

jobs:
  quality:
    name: Plan integrity, types, tests and bundled browser smoke
    runs-on: ubuntu-24.04
    # The 28-case software-rendered suite exceeded the previous whole-job
    # budget after 26 cases. Keep every test and a bounded evidence-upload window.
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Evidence validates historical implementation commits, not only HEAD.
          persist-credentials: false
      - name: Install pinned Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate repository, typecheck, test and build
        run: npm run check
      - name: Assemble and verify native asset bundle
        run: npm run bundle:ios
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run packaged browser harness tests
        run: npm run test:browser
      - name: Capture actual modular track joint geometry
        run: node tests/fixtures/track/capture-joints.mjs
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            dist/web/bundle-manifest.json
            dist/web/build-metafile.json
          if-no-files-found: error
          retention-days: 14

  asset-export:
    name: Reproducible Blender export and Khronos validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Re-export original fixture and reject malformed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/assets
          BLENDER_BIN="$(bash tools/assets/install-blender.sh)"
          export BLENDER_BIN
          "$BLENDER_BIN" --version > artifacts/assets/blender-version.txt
          npm ci --prefix tools/assets
          python3 tools/assets/archive-validation.test.py | tee artifacts/assets/archive-tests.txt
          npm --prefix tools/assets run test:source | tee artifacts/assets/source-tests.txt
          node tools/assets/validate-fixture.mjs
      - name: Preserve asset validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-validation-${{ github.sha }}
          path: artifacts/assets/
          if-no-files-found: error
          retention-days: 14
